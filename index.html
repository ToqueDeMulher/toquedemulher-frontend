    <meta name="description" content="Descubra seu próximo favorito na Toque de Mulher. Maquiagem, skincare, perfumes e autocuidado para a beleza do seu jeito." />
    <meta name="theme-color" content="#fff5fa" />
    <title>Toque de Mulher | Beleza do seu jeito</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        try {
          document.documentElement.dataset.reducedMotion = window.localStorage.getItem("tdm-reduced-motion") || "false";
          var key = "tdm-theme";
          var storedTheme = window.localStorage.getItem(key);
          var theme =
            storedTheme === "light" || storedTheme === "dark" ? storedTheme : "light";

          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
