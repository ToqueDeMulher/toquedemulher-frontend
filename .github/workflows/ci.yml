name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run test:coverage
        id: coverage
      - run: npm run build
      # Inclui ferramentas de build/teste; política em docs/dependency-security-review.md.
      - name: Auditar dependências (altas e críticas)
        run: npm audit --audit-level=high
      - name: Enviar relatório de cobertura
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: artifacts/unit-coverage/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Testes E2E
    # Playwright 1.56 ainda nao suporta o Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=github,list
      - name: Enviar traces e screenshots (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: |
            test-results/
            artifacts/screenshots/
          retention-days: 7
